<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>徐涛 - 视频运营 & 视觉设计师</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2D5F45',
                        secondary: '#FFB726',
                        accent: '#FF6B35',
                        light: '#F8F5EB',
                        dark: '#1A1A1A'
                    },
                    fontFamily: {
                        sans: ['Inter','system-ui','sans-serif'],
                        display: ['Poppins','system-ui','sans-serif']
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .text-shadow {text-shadow:2px 2px 4px rgba(0,0,0,0.1);}
            .hover-lift {transition:0.3s;}
            .hover-lift:hover {transform:translateY(-5px);box-shadow:0 10px 25px -5px rgba(0,0,0,0.1);}
        }
    </style>
</head>
<body class="bg-light text-dark font-sans overflow-x-hidden">

    <div id="app">
        <div id="login-panel" class="fixed inset-0 z-50 bg-dark flex items-center justify-center hidden">
            <div class="bg-white p-8 rounded-xl w-full max-w-md">
                <h2 class="text-2xl font-bold mb-6 text-center">管理后台登录</h2>
                <input id="login-user" class="w-full border p-2 rounded mb-3" placeholder="账号" value="admin">
                <input id="login-pwd" type="password" class="w-full border p-2 rounded mb-4" placeholder="密码" value="123456">
                <button id="login-btn" class="w-full bg-primary text-white py-2 rounded">登录</button>
            </div>
        </div>

        <div id="admin-panel" class="fixed top-0 left-0 w-80 h-full bg-white shadow-2xl z-50 transform -translate-x-full transition-transform overflow-y-auto pb-20">
            <div class="p-4 border-b sticky top-0 bg-white z-10 flex justify-between items-center">
                <h3 class="font-bold">后台管理</h3>
                <button id="close-admin" class="text-red-500">关闭</button>
            </div>
            <div class="p-4 space-y-4">
                <div><label class="block text-sm mb-1">姓名</label><input id="edit-name" class="w-full border p-2 rounded"></div>
                <div><label class="block text-sm mb-1">简介</label><textarea id="edit-desc" class="w-full border p-2 rounded h-24"></textarea></div>
                <div><label class="block text-sm mb-1">电话</label><input id="edit-phone" class="w-full border p-2 rounded"></div>
                <div><label class="block text-sm mb-1">邮箱</label><input id="edit-email" class="w-full border p-2 rounded"></div>
                <div><label class="block text-sm mb-1">头像URL</label><input id="edit-avatar" class="w-full border p-2 rounded"></div>
                <button id="save-all" class="w-full bg-accent text-white py-2 rounded mt-4">保存所有修改</button>
                <button id="logout-btn" class="w-full bg-gray-200 py-2 rounded mt-2">退出登录</button>
            </div>
        </div>

        <button id="admin-entry" class="fixed bottom-4 left-4 z-40 bg-dark text-white w-10 h-10 rounded-full flex items-center justify-center opacity-20 hover:opacity-100">
            <i class="fa fa-cog"></i>
        </button>

        <div id="frontend">
            <nav class="fixed top-0 left-0 w-full z-30 bg-light/95 backdrop-blur-sm">
                <div class="container mx-auto px-6 py-3 flex justify-between items-center">
                    <a class="text-xl font-bold" id="nav-name">徐涛</a>
                    <div class="hidden md:flex space-x-6">
                        <a href="#about">关于我</a>
                        <a href="#experience">经历</a>
                        <a href="#skills">技能</a>
                        <a href="#portfolio">作品集</a>
                        <a href="#contact">联系我</a>
                    </div>
                </div>
            </nav>

            <section id="about" class="pt-32 pb-20">
                <div class="container mx-auto px-6">
                    <div class="flex flex-col md:flex-row items-center gap-10">
                        <div class="md:w-1/2">
                            <h1 class="text-4xl md:text-5xl font-bold leading-tight mb-4">
                                你好<br><span class="text-primary" id="hero-name">我是徐涛</span>
                            </h1>
                            <p class="text-gray-600 mb-6" id="hero-desc">加载中...</p>
                            <a href="#portfolio" class="bg-accent text-white px-6 py-2 rounded-full hover-lift">查看作品</a>
                        </div>
                        <div class="w-64 h-64 relative">
                            <div class="absolute inset-0 bg-primary rounded-2xl rotate-3"></div>
                            <div class="absolute inset-0 bg-secondary rounded-2xl -rotate-3"></div>
                            <div class="absolute inset-3 bg-white rounded-xl overflow-hidden">
                                <img id="profile-image" class="w-full h-full object-cover" src="https://picsum.photos/id/1005/400/400">
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section id="portfolio" class="py-16 bg-gray-50">
                <div class="container mx-auto px-6">
                    <h2 class="text-3xl font-bold mb-3 text-center">作品集</h2>
                    <div class="flex flex-wrap justify-center gap-3 mb-10">
                        <button class="portfolio-filter active bg-primary text-white px-4 py-2 rounded-full" data-filter="all">全部</button>
                        <button class="portfolio-filter bg-gray-200 px-4 py-2 rounded-full" data-filter="promo">宣传片</button>
                        <button class="portfolio-filter bg-gray-200 px-4 py-2 rounded-full" data-filter="short">短视频</button>
                        <button class="portfolio-filter bg-gray-200 px-4 py-2 rounded-full" data-filter="ui">UI平面</button>
                        <button class="portfolio-filter bg-gray-200 px-4 py-2 rounded-full" data-filter="photography">商业摄影</button>
                    </div>
                    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6" id="portfolio-grid"></div>
                </div>
            </section>

            <section id="contact" class="py-16">
                <div class="container mx-auto px-6">
                    <h2 class="text-3xl font-bold mb-6 text-center">联系我</h2>
                    <div class="max-w-xl mx-auto bg-white p-6 rounded-xl shadow">
                        <div class="mb-3"><p class="text-sm text-gray-500">电话</p><p id="contact-phone" class="font-medium">13810878952</p></div>
                        <div class="mb-3"><p class="text-sm text-gray-500">邮箱</p><p id="contact-email" class="font-medium">xutao89@163.com</p></div>
                    </div>
                </div>
            </section>

            <footer class="bg-dark text-white py-6 text-center text-sm">© 2025 徐涛 保留所有权利</footer>
        </div>
    </div>

    <script>
        const ADMIN_USER = "admin";
        const ADMIN_PWD = "123456";

        const defaultData = {
            basic: {
                name: "徐涛",
                desc: "拥有18年跨越传统主流媒体、新媒体矩阵、AI视觉前沿的全周期视觉内容创作与团队操盘经验。",
                phone: "13810878952",
                email: "xutao89@163.com",
                avatar: "https://picsum.photos/id/1005/400/400"
            },
            portfolio: [
                {id:1,title:"宣传片01",categories:["promo"],cover:"https://picsum.photos/id/10/600/400"},
                {id:2,title:"宣传片02",categories:["promo"],cover:"https://picsum.photos/id/11/600/400"},
                {id:3,title:"宣传片03",categories:["promo"],cover:"https://picsum.photos/id/12/600/400"},
                {id:4,title:"宣传片04",categories:["promo"],cover:"https://picsum.photos/id/13/600/400"},
                {id:5,title:"宣传片05",categories:["promo"],cover:"https://picsum.photos/id/14/600/400"},
                {id:6,title:"宣传片06",categories:["promo"],cover:"https://picsum.photos/id/15/600/400"},
                {id:7,title:"短视频01",categories:["short"],cover:"https://picsum.photos/id/20/600/400"},
                {id:8,title:"短视频02",categories:["short"],cover:"https://picsum.photos/id/21/600/400"},
                {id:9,title:"UI设计",categories:["ui"],cover:"https://picsum.photos/id/30/600/400"},
                {id:10,title:"摄影01",categories:["photography"],cover:"https://picsum.photos/id/40/600/400"},
                {id:11,title:"摄影02",categories:["photography"],cover:"https://picsum.photos/id/41/600/400"},
                {id:12,title:"摄影03",categories:["photography"],cover:"https://picsum.photos/id/42/600/400"},
                {id:13,title:"摄影04",categories:["photography"],cover:"https://picsum.photos/id/43/600/400"},
                {id:14,title:"摄影05",categories:["photography"],cover:"https://picsum.photos/id/44/600/400"},
                {id:15,title:"摄影06",categories:["photography"],cover:"https://picsum.photos/id/45/600/400"},
                {id:16,title:"摄影07",categories:["photography"],cover:"https://picsum.photos/id/46/600/400"},
                {id:17,title:"摄影08",categories:["photography"],cover:"https://picsum.photos/id/47/600/400"},
                {id:18,title:"摄影09",categories:["photography"],cover:"https://picsum.photos/id/48/600/400"}
            ]
        };

        function loadData(){
            let d = localStorage.getItem("siteData");
            if(!d) d = JSON.stringify(defaultData);
            return JSON.parse(d);
        }

        function saveData(data){
            localStorage.setItem("siteData",JSON.stringify(data));
        }

        let data = loadData();

        function render(){
            document.getElementById("nav-name").textContent = data.basic.name;
            document.getElementById("hero-name").textContent = "我是"+data.basic.name;
            document.getElementById("hero-desc").textContent = data.basic.desc;
            document.getElementById("contact-phone").textContent = data.basic.phone;
            document.getElementById("contact-email").textContent = data.basic.email;
            document.getElementById("profile-image").src = data.basic.avatar;

            const grid = document.getElementById("portfolio-grid");
            grid.innerHTML = data.portfolio.map(item=>`
            <div class="portfolio-item ${item.categories.join(' ')}">
                <div class="bg-white rounded-xl overflow-hidden shadow hover-lift">
                    <div class="h-48"><img src="${item.cover}" class="w-full h-full object-cover"></div>
                    <div class="p-4"><h3 class="font-bold">${item.title}</h3></div>
                </div>
            </div>`).join('');
        }

        function bindAdmin(){
            const loginPanel = document.getElementById("login-panel");
            const adminPanel = document.getElementById("admin-panel");
            const adminEntry = document.getElementById("admin-entry");
            const loginBtn = document.getElementById("login-btn");
            const closeAdmin = document.getElementById("close-admin");
            const saveBtn = document.getElementById("save-all");
            const logoutBtn = document.getElementById("logout-btn");

            adminEntry.onclick = ()=>{loginPanel.classList.remove("hidden");}
            closeAdmin.onclick = ()=>{adminPanel.classList.add("-translate-x-full");}
            logoutBtn.onclick = ()=>{adminPanel.classList.add("-translate-x-full");}

            loginBtn.onclick = ()=>{
                const u = document.getElementById("login-user").value;
                const p = document.getElementById("login-pwd").value;
                if(u===ADMIN_USER && p===ADMIN_PWD){
                    loginPanel.classList.add("hidden");
                    adminPanel.classList.remove("-translate-x-full");
                    document.getElementById("edit-name").value = data.basic.name;
                    document.getElementById("edit-desc").value = data.basic.desc;
                    document.getElementById("edit-phone").value = data.basic.phone;
                    document.getElementById("edit-email").value = data.basic.email;
                    document.getElementById("edit-avatar").value = data.basic.avatar;
                }else{
                    alert("账号或密码错误");
                }
            }

            saveBtn.onclick = ()=>{
                data.basic.name = document.getElementById("edit-name").value;
                data.basic.desc = document.getElementById("edit-desc").value;
                data.basic.phone = document.getElementById("edit-phone").value;
                data.basic.email = document.getElementById("edit-email").value;
                data.basic.avatar = document.getElementById("edit-avatar").value;
                saveData(data);
                render();
                alert("保存成功！");
            }
        }

        function bindFilter(){
            const btns = document.querySelectorAll(".portfolio-filter");
            btns.forEach(b=>{
                b.onclick = ()=>{
                    btns.forEach(x=>{
                        x.classList.remove("active","bg-primary","text-white");
                        x.classList.add("bg-gray-200");
                    });
                    b.classList.add("active","bg-primary","text-white");
                    const f = b.getAttribute("data-filter");
                    document.querySelectorAll(".portfolio-item").forEach(i=>{
                        i.style.display = f==="all"||i.classList.contains(f)?"block":"none";
                    });
                }
            })
        }

        document.addEventListener("DOMContentLoaded",()=>{
            render();
            bindAdmin();
            bindFilter();
        });
    </script>
</body>
</html>
