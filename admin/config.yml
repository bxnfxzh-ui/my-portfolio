backend:
  name: git-gateway
  branch: main # 确保这是你的主分支名称

# 本地测试支持
local_backend: true

# 图片上传存放路径
media_folder: "images"
public_folder: "images"

collections:
  - name: "site_data"
    label: "全站内容管理"
    delete: false
    editor:
      preview: false
    files:
      - name: "data"
        label: "数据中心"
        file: "data.json"
        fields:
          - { label: "基本信息 (Basic)", name: "basic", widget: "object", fields: [
              { label: "姓名", name: "name", widget: "string" },
              { label: "个人描述", name: "desc", widget: "text" },
              { label: "手机号", name: "phone", widget: "string" },
              { label: "邮箱", name: "email", widget: "string" },
              { label: "头像地址", name: "avatar", widget: "image" }
            ]}
          - { label: "工作经历 (Experience)", name: "experience", widget: "list", fields: [
              { label: "公司名称", name: "company", widget: "string" },
              { label: "职位", name: "position", widget: "string" },
              { label: "时间段", name: "period", widget: "string" },
              { label: "核心职责 (Duties)", name: "duties", widget: "list" },
              { label: "核心业绩 (Achievements)", name: "achievements", widget: "list" }
            ]}
